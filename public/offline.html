<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <title>Sem conexão — AgroHub</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #172c23;
        font:
          16px/1.6 system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        padding: 32px;
        background: white;
        border: 1px solid #dce7e0;
        border-radius: 24px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
      }
      p {
        color: #53635a;
        margin-bottom: 24px;
      }
      button {
        padding: 14px 24px;
        border: 0;
        border-radius: 12px;
        background: #047857;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 600;
      }
      button:focus-visible {
        outline: 3px solid #60a5fa;
        outline-offset: 4px;
      }
      small {
        display: block;
        margin-top: 20px;
        color: #53635a;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="AgroHub" />
      <h1>Você está sem conexão</h1>
      <p>
        Conecte-se à internet para acessar seus talhões, consultar informações e salvar registros
        com segurança.
      </p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
      <small>O aplicativo continua instalado. Volte quando a conexão estiver disponível.</small>
    </main>
  </body>
</html>
